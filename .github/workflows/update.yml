name: Refresh and deploy

on:
  # Once a day, as the archive's maintainer suggested: the RSS feed says what
  # changed, the JSON API (100 requests a day) supplies each paper. 00:07 UTC
  # (08:07 Singapore), off the hour because GitHub's scheduler is most
  # congested at :00. No push trigger: every run spends API requests.
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The maintainer asked for a User-Agent that points to this site.
  EPRINT_UA: "eprint-venue/1.0 (+https://menghao303.github.io/eprint-venue/) daily metadata refresh"

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new and changed papers
        id: fetch
        env:
          EPRINT_API_KEY: ${{ secrets.EPRINT_API_KEY }}
        # A typical day is 10-20 API requests. --max 80 leaves headroom under
        # the 100-a-day limit for a manual run; anything over it is kept in
        # data/feed.json and fetched by the next run.
        run: |
          python3 scrape.py 2026 --feed --max 80
          # A day in which nothing moved rewrote no file, so git is the
          # signal: nothing to rebuild, commit or deploy. A manual run
          # always deploys, because the page itself may have changed.
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- data; then
            echo "eprint has nothing new; skipping the rebuild and deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        if: steps.fetch.outputs.changed == 'true'
        run: python3 build.py

      - name: Commit refreshed metadata
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%FT%RZ)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.changed == 'true'
        with:
          path: site

      - id: deploy
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
