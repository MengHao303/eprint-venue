name: Refresh and deploy

on:
  # Paused 2026-09-29: eprint.iacr.org started answering this job with a
  # Cloudflare 403 aimed at its User-Agent. The schedule and the push trigger
  # (which also fetches) stay off until the archive's maintainers say how, and
  # how often, we may read it. Run by hand only.
  #
  # Once they agree, uncomment one daily run at 00:07 UTC (08:07 Singapore);
  # off the hour, because GitHub's scheduler is most congested at :00.
  #
  # schedule:
  #   - cron: "7 0 * * *"
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The archive blocks this exact string (see `on:` above). Leave it alone and
  # change it only if the maintainers ask for a different one.
  EPRINT_UA: "eprint-venue/1.0 (+https://github.com/MengHao303/eprint-venue) hourly metadata refresh"

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new and changed papers
        id: fetch
        # --max keeps a single run small if a backlog builds up; the rest is
        # picked up by the next run.
        run: |
          # A daily run reads /days/3, which still covers one day that GitHub
          # dropped. Once the data is more than 60 h old (a longer outage,
          # a quiet stretch in which nothing was rewritten, or a fresh clone),
          # only the full year listing can say what moved.
          AGE=$(python3 -c "import calendar, json, time; print(int(time.time() - calendar.timegm(time.strptime(json.load(open('data/2026.json'))['fetched'], '%Y-%m-%dT%H:%M:%SZ'))))" 2>/dev/null || echo 999999)
          if [ "$AGE" -gt 216000 ]; then
            echo "full year listing (data is ${AGE}s old)"
            python3 scrape.py 2026 --delay 1.5 --max 300
          else
            echo "probe (data is ${AGE}s old)"
            python3 scrape.py 2026 --recent 3 --delay 1.5 --max 300
          fi
          # A probe that found nothing rewrote no file, so git is the
          # signal: nothing to rebuild, commit or deploy. A push or a manual
          # run always deploys, because the page itself may have changed.
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- data; then
            echo "eprint has nothing new; skipping the rebuild and deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        if: steps.fetch.outputs.changed == 'true'
        run: python3 build.py

      - name: Commit refreshed metadata
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%FT%RZ)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.fetch.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.changed == 'true'
        with:
          path: site

      - id: deploy
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
